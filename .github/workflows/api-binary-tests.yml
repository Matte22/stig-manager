
name: Build and Test Binary Artifacts
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - binary-test-wf
    paths:
      - "api/source/**"
      - "test/api/**"
      - ".github/workflows/api-binary-tests.yml"
  push:
    branches:
      - main
      - binary-test-wf
    paths:
      - "api/source/**"
      - "test/api/**"
      - ".github/workflows/api-binary-tests.yml"
env:
  STIGMAN_API_PORT: 64001
  STIGMAN_DB_HOST: localhost
  STIGMAN_DB_PORT: 3306
  STIGMAN_DB_PASSWORD: stigman
  STIGMAN_API_AUTHORITY: http://localhost:8080/auth/realms/stigman
  STIGMAN_SWAGGER_ENABLED: true
  STIGMAN_SWAGGER_SERVER: http://localhost:64001/api
  STIGMAN_SWAGGER_REDIRECT: http://localhost:64001/api-docs/oauth2-redirect.html
  STIGMAN_DEV_RESPONSE_VALIDATION: logOnly
  STIGMAN_EXPERIMENTAL_APPDATA: 'true'
  STIGMAN_OIDC_PROVIDER: http://localhost:8080/auth/realms/stigman
jobs:
  build-binary-artifacts:
    name: Build binary artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Get repository metadata
        id: repo
        uses: actions/github-script@v7
        with:
          script: |
            const repo = await github.rest.repos.get(context.repo)
            return repo.data     

      - name: install uglify
        run: |
          sudo npm install -g uglify-js    

      - name: run build script
        id: run-the-build-script
        working-directory: ./api
        run: ./build.sh
   
      - name: Upload builds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-artifacts
          path: ./api/bin/
          if-no-files-found: error

      - name: Upload archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-archives
          path: ./api/dist/
          if-no-files-found: error
 
