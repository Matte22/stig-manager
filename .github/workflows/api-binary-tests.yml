  run-test-windows-binary-artifact:
    name: Run and test Windows artifact (with WSL and Docker)
    runs-on: windows-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install WSL and Ubuntu
        uses: Vampire/setup-wsl@v3
        with:
          distribution: "Ubuntu-22.04" # You can use "Ubuntu-20.04" if needed
          set-as-default: true
          additional-packages: "docker.io python3 curl"

      - name: Start MySQL in Docker Inside WSL
        shell: pwsh
        run: |
          echo "Starting MySQL container in WSL..."
          wsl docker run -d --name stig-manager-db \
            -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=rootpw \
            -e MYSQL_DATABASE=stigman \
            -e MYSQL_USER=stigman \
            -e MYSQL_PASSWORD=stigman \
            mysql:8.0.24
          echo "MySQL container started in WSL."

      - name: Start Mock Keycloak HTTP Server in WSL
        shell: pwsh
        run: |
          echo "Starting Mock Keycloak HTTP server..."
          wsl nohup python3 -m http.server 8080 --bind 0.0.0.0 > /dev/null 2>&1 &
          echo "Mock Keycloak HTTP server started."

      - name: Verify MySQL & Mock Keycloak Are Running in WSL
        shell: pwsh
        run: |
          echo "Checking if Keycloak is running..."
          wsl curl -s http://localhost:8080 || echo "Keycloak is NOT responding!"

          echo "Checking MySQL container..."
          wsl docker ps
          wsl mysql -h 127.0.0.1 -u stigman -pstigman -e "SHOW DATABASES;" || echo "MySQL connection failed!"

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          name: binary-artifacts  
          path: ./binary-artifacts

      - name: Run Windows binary (Direct)
        working-directory: ./binary-artifacts
        shell: pwsh
        run: |
          echo "Running tests on binary artifacts"
          .\stig-manager-win.exe
        env:
          STIGMAN_DB_HOST: localhost
          STIGMAN_DB_PORT: 3306
          STIGMAN_OIDC_PROVIDER: http://localhost:8080/auth/realms/stigman

     